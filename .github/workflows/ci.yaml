# Typecheck, the offline test suites and the ACP compliance kit, on every pull request into main and on
# every push to dev. No key, no spend: the suites run on scripted models.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: astral-sh/setup-uv@v6
      - name: ACP compliance kit
        run: npm run tck
